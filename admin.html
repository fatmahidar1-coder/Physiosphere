<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PhysioSphere Studio</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="admin-login">

    <h1>PhysioSphere Studio</h1>

    <p class="subtitle">
        Administrator Login
    </p>

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button id="loginBtn">
        Login
    </button>

    <p id="message"></p>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
